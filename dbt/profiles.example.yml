# Copy this file to ~/.dbt/profiles.yml and fill in your credentials.
# Never commit a real profiles.yml with credentials to version control.

retail360:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: RETAIL360_TRANSFORMER
      database: RETAIL360_DEV
      warehouse: TRANSFORM_WH
      schema: dbt_dev_yourname
      threads: 4

    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      role: RETAIL360_TRANSFORMER
      database: RETAIL360_CI
      warehouse: TRANSFORM_WH
      schema: dbt_ci
      threads: 8

    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      private_key: "{{ env_var('SNOWFLAKE_PRIVATE_KEY') }}"
      role: RETAIL360_TRANSFORMER
      database: RETAIL360
      warehouse: TRANSFORM_WH
      schema: dbt_prod
      threads: 8
