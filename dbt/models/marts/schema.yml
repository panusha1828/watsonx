version: 2

models:
  - name: dim_customer
    description: "Customer dimension enriched with lifetime order aggregates."
    group: customer_analytics
    columns:
      - name: customer_sk
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null

  - name: dim_product
    description: "Product dimension with computed unit margin."
    columns:
      - name: product_sk
        tests:
          - unique
          - not_null

  - name: dim_store
    description: "Store / location dimension."
    group: sales_analytics
    columns:
      - name: store_sk
        tests:
          - unique
          - not_null

  - name: dim_date
    description: "Standard calendar date spine, 2023-01-01 through 2 years ahead."
    columns:
      - name: date_sk
        tests:
          - unique
          - not_null
      - name: full_date
        tests:
          - unique
          - not_null

  - name: fact_orders
    description: "Order-header grain fact table. Incremental on order_date."
    group: sales_analytics
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customer_id

  - name: fact_sales
    description: >
      Primary sales fact table used for revenue reporting and executive
      dashboards. Grain: one row per order. See docs/architecture.md section
      8 for full lineage.
    group: sales_analytics
    columns:
      - name: sales_sk
        tests:
          - unique
          - not_null

  - name: fact_inventory
    description: >
      Inventory fact table. Currently built on a placeholder estimate model
      (int_inventory_metrics) pending a true inventory source feed.
    columns:
      - name: product_id
        tests:
          - not_null

  - name: fact_payments
    description: "Payment transaction fact table, one row per payment."
    columns:
      - name: payment_sk
        tests:
          - unique
          - not_null

exposures:
  - name: executive_sales_dashboard
    type: dashboard
    maturity: high
    url: https://app.powerbi.com/groups/retail360/executive-sales-dashboard
    description: "Executive-facing revenue and channel performance dashboard."
    depends_on:
      - ref('fact_sales')
      - ref('dim_customer')
      - ref('dim_store')
      - ref('dim_date')
    owner:
      name: "Sales Analytics Team"
      email: "sales-analytics@retail360.example.com"

  - name: customer_360_dashboard
    type: dashboard
    maturity: medium
    url: https://app.powerbi.com/groups/retail360/customer-360
    description: "Customer 360 view: lifetime value, order history, loyalty tier."
    depends_on:
      - ref('dim_customer')
      - ref('fact_orders')
    owner:
      name: "Customer Analytics Team"
      email: "customer-analytics@retail360.example.com"
