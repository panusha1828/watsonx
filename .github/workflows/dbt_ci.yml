name: dbt CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'dbt/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install sqlfluff
        run: pip install sqlfluff sqlfluff-templater-dbt
      - name: Lint models
        run: sqlfluff lint dbt/models --dialect snowflake

  build_and_test:
    runs-on: ubuntu-latest
    needs: lint
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dbt
        run: pip install dbt-snowflake==1.7.1
      - name: dbt deps
        run: cd dbt && dbt deps
      - name: dbt seed
        run: cd dbt && dbt seed --target ci
      - name: dbt run
        run: cd dbt && dbt run --target ci
      - name: dbt test
        run: cd dbt && dbt test --target ci
      - name: dbt docs generate
        run: cd dbt && dbt docs generate --target ci
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: dbt/target
